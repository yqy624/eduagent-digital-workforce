<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智慧教育平台</title>
<meta name="description" content="看课堂、批作业、查学情的智慧教育平台">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1826'/%3E%3Cpath d='M9 13V9h4M19 9h4v4M23 19v4h-4M13 23H9v-4' stroke='%23e0a021' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23e0a021'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/console.css">
<style>
  /* 首屏底色，避免加载 JS 前的白闪 */
  html, body { background: #eaeef3; }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #0b1119; }
  #boot { min-height: 100vh; display: grid; place-items: center; color: #79879e; gap: 14px;
          font: 13.5px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #boot .sp { width: 26px; height: 26px; border: 2px solid #d8dfe9; border-top-color: #e0a021;
              border-radius: 50%; animation: bspin .7s linear infinite; margin: 0 auto; }
  @keyframes bspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="spineRoot">
  <div id="boot"><div><div class="sp"></div></div><div>正在加载…</div></div>
</div>

<!-- 功能清单配置（纯数据） -->
<script src="/static/js/menu.config.js"></script>
<!-- 控制台应用（ES 模块，无需构建） -->
<script type="module" src="/static/js/console/app.js"></script>
</body>
</html>
