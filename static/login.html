<!-- 功能清单配置（用于左侧实时概览） -->
<script src="/static/js/menu.config.js"></script>
<script type="module">
import { icon } from "/static/js/console/icons.js";
import { login, register, forgotPassword, session } from "/static/js/console/api.js";
import { modal, toast, plate, noteBox, kv } from "/static/js/console/ui.js";
import { h, raw, esc, fmtTime, num } from "/static/js/console/dom.js";

/* ---- 图标水合：把 data-icon 占位替换成内联 SVG ---- */
function hydrate(root) {
  (root || document).querySelectorAll("[data-icon]").forEach((el) => {
    el.innerHTML = icon(el.getAttribute("data-icon"));
    el.removeAttribute("data-icon");
  });
}
hydrate();

const $ = (s) => document.querySelector(s);
const REMEMBER = "ea.remember";

/* ---- 入口感知：按来源页决定登录后的去向与品牌 ----
   从数字员工协作台（/、/workspace）被弹过来时，整页按数字员工的品牌呈现；
   只有明确要去 /platform 时才显示智慧教育平台。 */
const NEXT = new URLSearchParams(location.search).get("next");
const GO_PLATFORM = !!NEXT && NEXT.indexOf("/platform") === 0;
if (!GO_PLATFORM) {
  const brandName = document.querySelector(".pc-logo b");
  if (brandName) brandName.textContent = "数字员工协作台";
}

/* ---- 已登录直接进入 ---- */
if (session.token) {
  location.replace(NEXT && NEXT[0] === "/" ? NEXT : "/");
}

/* ---- 角色分段 ---- */
let role = "ADMIN";
$("#roleSeg").addEventListener("click", (e) => {
  const b = e.target.closest("[data-role]");
  if (!b) return;
  role = b.getAttribute("data-role");
  document.querySelectorAll("#roleSeg .seg-btn").forEach((x) => x.classList.toggle("is-on", x === b));
});

function setRole(r) {
  role = r;
  document.querySelectorAll("#roleSeg .seg-btn").forEach((x) => x.classList.toggle("is-on", x.getAttribute("data-role") === r));
}

function msg(text, kind) {
  const box = $("#msg");
  if (!text) { box.hidden = true; box.textContent = ""; return; }
  box.hidden = false;
  box.className = "field-msg " + (kind === "ok" ? "is-ok" : "is-err");
  box.textContent = text;
}

/* ---- 演示账号 ---- */
document.querySelectorAll("[data-u]").forEach((b) => b.addEventListener("click", () => {
  setRole(b.getAttribute("data-r"));
  $("#username").value = b.getAttribute("data-u");
  $("#password").value = "Demo@12345";
  $("#password").focus();
}));

/* ---- 记住账号 ---- */
try {
  const saved = JSON.parse(localStorage.getItem(REMEMBER) || "null");
  if (saved) { $("#username").value = saved.username || ""; if (saved.role) setRole(saved.role); $("#remember").checked = true; }
} catch (_) {}

/* ---- 登录 ---- */
$("#loginBtn").addEventListener("click", async () => {
  const username = $("#username").value.trim();
  const password = $("#password").value.trim();
  if (!username || !password) { msg("请输入用户名和密码"); return; }
  const btn = $("#loginBtn");
  const old = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 验证中';
  msg("");
  try {
    await login(username, password, role);
    if ($("#remember").checked) localStorage.setItem(REMEMBER, JSON.stringify({ username, role }));
    else localStorage.removeItem(REMEMBER);
    // 回跳优先：有合法 next 就回到来源页；直接打开登录页则默认回「数字员工协作台」
    location.href = NEXT && NEXT[0] === "/" ? NEXT : "/";
  } catch (err) {
    msg(err.message || "登录失败");
    btn.disabled = false; btn.innerHTML = old;
  }
});

/* ---- 注册 ---- */
$("#goRegister").addEventListener("click", () => {
  modal({
    title: "注册账号",
    body: h`<div class="stack">
      <div class="grid grid-2">
        <div class="field"><label class="label">用户名<span class="req">*</span></label><input class="input" id="rU" placeholder="至少 3 位"></div>
        <div class="field"><label class="label">姓名</label><input class="input" id="rN" placeholder="可留空"></div>
        <div class="field"><label class="label">邮箱</label><input class="input" id="rE" placeholder="可留空"></div>
        <div class="field"><label class="label">角色</label>
          <div class="select-wrap"><select class="select" id="rR"><option value="STUDENT">学生</option><option value="TEACHER">教师</option></select></div></div>
        <div class="field"><label class="label">密码<span class="req">*</span></label><input class="input" id="rP" type="password" placeholder="至少 6 位"></div>
        <div class="field"><label class="label">确认密码<span class="req">*</span></label><input class="input" id="rP2" type="password"></div>
      </div>
    </div>`,
    footer: h`<button class="btn btn--outline" type="button" data-close>取消</button>
             <button class="btn btn--primary" type="button" id="rOk">注册</button>`,
    mount: (body, close) => {
      body.querySelector("#rOk").addEventListener("click", () => {
        const u = body.querySelector("#rU").value.trim();
        const p = body.querySelector("#rP").value.trim();
        if (u.length < 3) return toast("用户名至少 3 位", "err");
        if (p.length < 6) return toast("密码至少 6 位", "err");
        if (p !== body.querySelector("#rP2").value.trim()) return toast("两次密码不一致", "err");
        const btn = body.querySelector("#rOk"); btn.disabled = true;
        register({ username: u, password: p, displayName: body.querySelector("#rN").value.trim(), email: body.querySelector("#rE").value.trim(), role: body.querySelector("#rR").value })
          .then(() => { close(); setRole(body.querySelector("#rR").value); $("#username").value = u; msg("注册成功，请登录", "ok"); })
          .catch((e) => { toast(e.message, "err"); btn.disabled = false; });
      });
    },
  });
});

/* ---- 找回密码 ---- */
$("#goForgot").addEventListener("click", () => {
  modal({
    title: "重置密码",
    body: h`<div class="stack">
      <div class="field"><label class="label">用户名<span class="req">*</span></label><input class="input" id="fU"></div>
      <div class="field"><label class="label">角色</label>
        <div class="select-wrap"><select class="select" id="fR"><option value="STUDENT">学生</option><option value="TEACHER">教师</option></select></div></div>
      <div class="field"><label class="label">预留邮箱</label><input class="input" id="fE" placeholder="注册时填过则必填"></div>
      <div class="field"><label class="label">新密码<span class="req">*</span></label><input class="input" id="fP" type="password" placeholder="至少 6 位"></div>
      <div class="field"><label class="label">确认新密码<span class="req">*</span></label><input class="input" id="fP2" type="password"></div>
    </div>`,
    footer: h`<button class="btn btn--outline" type="button" data-close>取消</button>
             <button class="btn btn--primary" type="button" id="fOk">重置</button>`,
    mount: (body, close) => {
      body.querySelector("#fOk").addEventListener("click", () => {
        const u = body.querySelector("#fU").value.trim();
        const p = body.querySelector("#fP").value.trim();
        if (!u) return toast("请输入用户名", "err");
        if (p.length < 6) return toast("新密码至少 6 位", "err");
        if (p !== body.querySelector("#fP2").value.trim()) return toast("两次密码不一致", "err");
        const btn = body.querySelector("#fOk"); btn.disabled = true;
        forgotPassword({ username: u, role: body.querySelector("#fR").value, email: body.querySelector("#fE").value.trim(), newPassword: p })
          .then(() => { close(); msg("密码已重置，请用新密码登录", "ok"); })
          .catch((e) => { toast(e.message, "err"); btn.disabled = false; });
      });
    },
  });
});

/* ---- 回车提交 ---- */
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !document.querySelector(".modal")) $("#loginBtn").click();
});

/* ================= 左侧真实读数 ================= */

// 可用功能规模（本地配置，无需网络）
const MENU = window.PLATFORM_MENU;
if (MENU && MENU.modules) {
  const n = MENU.modules.reduce((a, m) => a + (m.children ? m.children.length : 0), 0);
  $("#mCount").innerHTML = n + "<small>项</small>";
}

// 视口右上角走一个真实时钟 —— 给画面一个"正在运行"的时间锚点，不伪造识别结果
const tickClock = () => {
  const el = $("#hudClock");
  if (el) el.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
};
tickClock();
setInterval(tickClock, 1000);
// 画面里共 9 人（1 位教师 + 8 名学生），只标出 5 个把握足够的框。
// 两个数字都写出来，不做"全部识别成功"的暗示。
$("#hudCount").textContent = "全班 9 人 · 已标记 5 人";

// 后端状态
fetch("/api/health").then((r) => r.json()).then((d) => {
  const ok = d && (d.status === "ok" || d.status === "degraded");
  const st = $("#pcState");
  st.className = "pc-state";
  st.innerHTML = icon("wifi") + (ok ? "服务正常" : "暂时连不上");
  const checks = (d && d.checks) || {};
  const vision = ((checks.modelRegistry || {}).capabilities || {}).vision || {};
  const impl = (vision.implementations || {})[vision.default] || {};
  const ph = impl.placeholder !== false;
  $("#mVision").textContent = ph ? "准备中" : "已开启";
  $("#mVision").style.color = ph ? "#f0bb5c" : "#5fd6ab";
}).catch(() => {
  $("#pcState").innerHTML = icon("alert") + "暂时连不上";
  $("#pcState").style.color = "#f39a95";
  $("#mVision").textContent = "准备中";
});

// 今日事件数与事件流。该接口需要身份 —— 未登录时如实说明，而不是显示"0 条"让人误以为平台没数据。
fetch("/api/vision/events?limit=40")
  .then((r) => r.json().then((res) => ({ status: r.status, res })))
  .then(({ status, res }) => {
  const body = $("#tickerBody");
  if (status === 401 || (res && res.code === 401)) {
    $("#mEvents").innerHTML = "—<small>登录后可见</small>";
    body.innerHTML = '<div class="pc-ev"><span class="lab dim">登录后这里显示今天的课堂与考场动态</span></div>';
    return;
  }
  const list = (res && res.data) || [];
  const today = new Date().toDateString();
  const t = list.filter((e) => {
    const d = new Date(String(e.createdAt || "").replace(" ", "T"));
    return !isNaN(d.getTime()) && d.toDateString() === today;
  }).length;
  $("#mEvents").innerHTML = (t || list.length) + "<small>条</small>";
  if (!list.length) {
    body.innerHTML = '<div class="pc-ev"><span class="lab dim">今天还没有新动态</span></div>';
    return;
  }
  body.innerHTML = list.slice(0, 6).map((e) => {
    const sev = e.severity || "info";
    const cls = sev === "critical" ? "al" : sev === "warning" ? "at" : "ok";
    const label = e.eventLabel || e.event_label || e.eventType || e.event_type || "事件";
    const conf = e.confidence == null ? "—" : Math.round(Number(e.confidence) * 100) + "%";
    return h`<div class="pc-ev">
      <span class="t">${fmtTime(e.createdAt || e.created_at)}</span>
      <span class="lab">${esc(label)} · ${esc(e.scene || "")}</span>
      <span class="cf">${conf}</span>
      <span class="pill ${cls}">${sev === "critical" ? "严重" : sev === "warning" ? "关注" : "记录"}</span>
    </div>`;
  }).join("");
}).catch(() => {
  $("#tickerBody").innerHTML = '<div class="pc-ev"><span class="lab dim">暂时连不上</span></div>';
  $("#mEvents").innerHTML = "—<small>条</small>";
});
</script>
</body>
</html>
